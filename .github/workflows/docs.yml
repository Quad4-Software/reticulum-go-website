# Pinned actions (bump tag and SHA together when upgrading):
#   actions/checkout@v7.0.0              9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
#   softprops/action-gh-release@v2.4.2     5be0e66d93ac7ed76da52eca8bb058f665c3a5fe
#
name: Release Docs

on:
  push:
    tags:
      - 'v*'

concurrency:
  group: release-docs-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release-docs:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Package docs
        run: sh scripts/docs/prepare-release-docs.sh

      - name: Upload docs to release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: ${{ github.ref_name }}
          files: releases/docs-en.zip
          generate_release_notes: false
